name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: O'rnatish
        run: npm ci

      - name: Web qismini tayyorlash
        run: |
          sh build.sh
          sh tools/prepare_www.sh

      - name: Android loyihasi
        run: |
          npx cap add android
          sh tools/patch_android.sh
          npx cap sync android

      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../formula-1a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: formula-1a-apk
          path: formula-1a.apk

      - name: Release'ga yuklash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Formula 1a APK (${{ github.run_number }})
          body: Telefonga yuklab o'rnating. Debug APK — "Noma'lum manbalar"ga ruxsat bering.
          files: formula-1a.apk
